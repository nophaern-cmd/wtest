<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>H5测试页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .title {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    
    .subtitle {
      font-size: 14px;
      color: #666;
    }
    
    .content {
      margin-bottom: 30px;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
      padding-left: 10px;
      border-left: 4px solid #4A90E2;
    }
    
    .section-content {
      font-size: 15px;
      color: #666;
      line-height: 1.8;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    
    .audio-section {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #FFF5E6 0%, #FFE4C4 100%);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    
    .audio-title {
      font-size: 16px;
      color: #8B5A2B;
      margin-bottom: 15px;
    }
    
    audio {
      width: 100%;
      max-width: 300px;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .btn {
      flex: 1;
      min-width: 120px;
      padding: 14px 20px;
      background: linear-gradient(135deg, #4A90E2 0%, #5BA3F5 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, #B8860B 0%, #DAA520 100%);
    }
    
    .status {
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 8px;
      font-size: 14px;
      color: #2e7d32;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">🎉 H5测试成功</div>
      <div class="subtitle">这是一个嵌入小程序的H5页面</div>
    </div>
    
    <div class="content">
      <div class="section">
        <div class="section-title">页面信息</div>
        <div class="section-content">
          <p>✅ H5页面已成功加载</p>
          <p>✅ 可以在小程序中正常显示</p>
          <p>✅ 支持音频播放功能</p>
        </div>
      </div>
      
      <div class="audio-section">
        <div class="audio-title">🎵 音频播放测试</div>
        <audio controls>
          <source src="https://lian-1394056348.cos.ap-beijing.myqcloud.com/guoxue/audio/sanzi_01_%E4%BA%BA%E4%B9%8B%E5%88%9D_%E6%AD%A3%E6%96%87.mp3" type="audio/mpeg">
          您的浏览器不支持音频播放
        </audio>
      </div>
    </div>
    
    <div class="btn-group">
      <button class="btn" onclick="sendMessage()">发送消息给小程序</button>
      <button class="btn btn-secondary" onclick="goBack()">返回小程序</button>
    </div>
    
    <div class="status" id="status">
      页面加载时间: <span id="time"></span>
    </div>
  </div>
  
  <script>
    // 显示加载时间
    document.getElementById('time').textContent = new Date().toLocaleString();
    
    // 判断是否在小程序环境
    function isInWechat() {
      return /miniProgram/i.test(navigator.userAgent);
    }
    
    // 发送消息给小程序
    function sendMessage() {
      if (isInWechat()) {
        wx.miniProgram.postMessage({
          data: {
            message: '来自H5的消息',
            time: new Date().toISOString()
          }
        });
        alert('消息已发送');
      } else {
        alert('当前不在小程序环境中');
      }
    }
    
    // 返回小程序
    function goBack() {
      if (isInWechat()) {
        wx.miniProgram.navigateBack({
          delta: 1
        });
      } else {
        alert('当前不在小程序环境中');
        history.back();
      }
    }
    
    // 输出环境信息
    console.log('User Agent:', navigator.userAgent);
    console.log('是否在小程序中:', isInWechat());
  </script>
</body>
</html>
